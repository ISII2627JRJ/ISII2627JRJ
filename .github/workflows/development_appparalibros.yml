
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.Net Core app to Azure Web App - appparalibros

on:
  push:
    branches:
      - 'CD-RobertoOliver'

  pull_request:
    branches:
      - 'development'
    types:
      - closed

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore API dependencies
        run: dotnet restore src/AppForSEII.API/AppForSEII.API.csproj

      - name: Restore UT dependencies
        run: dotnet restore test/AppForSEII.UT/AppForSEII.UT.csproj

      - name: Build API
        run: dotnet build src/AppForSEII.API/AppForSEII.API.csproj --configuration Release --no-restore

      - name: Build UT
        run: dotnet build test/AppForSEII.UT/AppForSEII.UT.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test test/AppForSEII.UT/AppForSEII.UT.csproj --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx"

      - name: Publish API
        run: dotnet publish src/AppForSEII.API/AppForSEII.API.csproj --configuration Release --no-build -o "${{ runner.temp }}/myapp"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/myapp

  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      # - name: Login to Azure
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4461B01FB9FA4A6BA9F741187C7219E4 }}
      #     tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CFECD527C6B4495DB85B7237720D686C }}
      #     subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_25870D0D74B945DD807555E7CC23EF1C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'appparalibros'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_ROBERTO }}
          package: .
